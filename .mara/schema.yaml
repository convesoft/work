format_version: 3
flavours:
  term:
    description: Controlled project vocabulary whose stable meaning prevents ambiguity.
    use_when:
      - "Define project-specific vocabulary whose ambiguity would harm authoring or review."
    avoid_when:
      - "Repeat words with their ordinary meaning or temporary implementation names."
    distinguish_from: {}
    id_prefix: TERM-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
  actor:
    description: A durable participant role or external system.
    use_when:
      - "Identify a durable human role, agent, service, or external system that participates in behaviour and is referenced across items."
    avoid_when:
      - "Record an individual assignee or temporary delivery ownership."
    distinguish_from: {}
    id_prefix: ACT-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
  goal:
    description: A durable desired stakeholder or product outcome.
    use_when:
      - "State a durable desired outcome that explains lower-level work and spans multiple scenarios or releases."
    avoid_when:
      - "Record implementation tasks, milestones, or concrete interaction steps."
    distinguish_from:
      scenario: "Describes a concrete behavioural flow rather than a broader desired outcome."
    id_prefix: GOAL-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
  scenario:
    description: A concrete behavioural flow with an observable outcome.
    use_when:
      - Describe one user, system, failure, or agent flow to discover and validate behaviour.
    avoid_when:
      - Record delivery tasks or obligations that hold across multiple flows.
    distinguish_from:
      requirement: States an obligation that may apply across multiple flows.
    id_prefix: SCN-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
  requirement:
    description: An independently verifiable obligation.
    use_when:
      - State an obligation whose non-conformance can be determined from observable evidence.
    avoid_when:
      - Combine separable obligations or include rationale and solution choices.
    distinguish_from:
      scenario: Describes one concrete flow with an observable outcome.
      design: Defines how an obligation is satisfied.
    id_prefix: REQ-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
      kind: {type: enum, values: [functional, quality, constraint]}
      concern: {type: string, repeatable: true}
  design:
    description: A solution or interface contract that satisfies requirements.
    use_when:
      - Define durable architecture, interfaces, formats, components, or algorithms for implementers.
    avoid_when:
      - State product obligations or selection rationale.
    distinguish_from:
      requirement: States what must hold, rather than how it is satisfied.
      decision: Records why a consequential choice was selected.
    id_prefix: DES-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
      kind: {type: enum, values: [structure, behavior, interface, data, deployment]}
      concern: {type: string, repeatable: true}
  decision:
    description: A consequential choice and its durable rationale.
    use_when:
      - Preserve consequential rationale or meaningful trade-offs among alternatives.
    avoid_when:
      - Record routine or easily reversible details.
    distinguish_from:
      design: Defines the selected solution contract rather than selection rationale.
    id_prefix: ADR-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
  risk:
    description: A material uncertain condition that could cause harm.
    use_when:
      - "Record an uncertain condition whose exposure or mitigation should influence durable product, delivery, safety, or maintainability work."
    avoid_when:
      - "Track known defects or ordinary follow-up work; keep those in the backlog."
    distinguish_from: {}
    id_prefix: RISK-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
      treatment: {type: enum, values: [open, mitigated, tolerated]}
      impact: {type: enum, values: [low, medium, high]}
      likelihood: {type: enum, values: [low, medium, high]}
  verification:
    description: A repeatable verification or validation method.
    use_when:
      - "Define a repeatable test, inspection, analysis, or demonstration with observable expectations when the method needs durable identity or traceability."
    avoid_when:
      - "Duplicate ordinary automated tests from code or record a particular execution result."
    distinguish_from:
      evidence: "Records the result and provenance of one verification execution."
    id_prefix: VER-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
      method: {type: enum, values: [test, inspection, analysis, demonstration]}
      level: {type: enum, values: [unit, integration, system, acceptance]}
  evidence:
    description: One concrete verification or validation result with provenance.
    use_when:
      - "Record one concrete verification or validation result with provenance when the result needs durable auditability."
    avoid_when:
      - "Duplicate routine CI results, logs, or the reusable verification method."
    distinguish_from:
      verification: "Defines a repeatable method and its observable expectations."
    id_prefix: EVD-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
      result: {type: enum, values: [passed, failed, inconclusive]}
      captured_at: {type: string}
      subject_revision: {type: string}
  artifact:
    description: A concrete implementation or external output with independent identity.
    use_when:
      - "Identify meaningful commands, APIs, schemas, services, reports, standards, or other concrete outputs whose identity matters independently of location."
    avoid_when:
      - "Create an item for every source file, document, section, or symbol."
    distinguish_from: {}
    id_prefix: ART-
    body: required
    fields:
      status: {type: enum, required: true, values: [draft, accepted, retired]}
relations:
  derives_from:
    description: The source originates from the target's intent or authority. Use refines for decomposition and sourced_from for an external source.
    source: [requirement, design]
    target: [scenario, requirement, artifact]
    inverse: source_of
    acyclic: {severity: error}
  contributes_to:
    description: The scenario or requirement advances the target goal.
    source: [scenario, requirement]
    target: [goal]
    inverse: supported_by
  involves:
    description: The actor participates in the scenario.
    source: [scenario]
    target: [actor]
    inverse: involved_in
  refines:
    description: The source gives a more specific part or elaboration of the target, without replacing it.
    source: [goal, requirement, design]
    target: [goal, requirement, design]
    same_flavour: true
    inverse: refined_by
    acyclic: {severity: error}
  depends_on:
    description: The source cannot be satisfied, understood, or implemented independently of the target.
    source: [term, actor, goal, scenario, requirement, design, decision, risk, verification, evidence, artifact]
    target: [term, actor, goal, scenario, requirement, design, decision, risk, verification, evidence, artifact]
    inverse: required_by
  satisfies:
    description: The design provides a solution contract for the requirement.
    source: [design]
    target: [requirement]
    inverse: satisfied_by
  justifies:
    description: The decision records the rationale for the requirement, design, or risk treatment.
    source: [decision]
    target: [requirement, design, risk]
    inverse: justified_by
  supersedes:
    description: The source replaces an older target of the same flavour, retaining it as history. Do not use for ordinary edits.
    source: [term, actor, goal, scenario, requirement, design, decision, risk, verification, evidence, artifact]
    target: [term, actor, goal, scenario, requirement, design, decision, risk, verification, evidence, artifact]
    same_flavour: true
    inverse: superseded_by
    acyclic: {severity: error}
  verifies:
    description: The verification defines how to check conformance to the requirement or design.
    source: [verification]
    target: [requirement, design]
    inverse: verified_by
  validates:
    description: The verification defines how to check achievement of the goal or scenario outcome.
    source: [verification]
    target: [goal, scenario]
    inverse: validated_by
  evidences:
    description: The evidence records a concrete result of performing the verification.
    source: [evidence]
    target: [verification]
    inverse: evidenced_by
  realizes:
    description: The artifact provides a concrete realization of the requirement or design.
    source: [artifact]
    target: [requirement, design]
    inverse: realized_by
  implements:
    description: The code implements the requirement, design, or verification method; this association does not prove correctness or execution.
    source: []
    target: [requirement, design, verification]
    code_source: true
    inverse: implemented_by
  checks:
    description: The code defines a check of the requirement or design; this association does not report a passing execution.
    source: []
    target: [requirement, design]
    code_source: true
    inverse: checked_by
  affects:
    description: The risk exposes the target knowledge to potential harm.
    source: [risk]
    target: [term, actor, goal, scenario, requirement, design, decision, risk, verification, evidence, artifact]
    inverse: affected_by
  mitigates:
    description: The source specifies or provides a measure reducing the risk.
    source: [requirement, design, decision, verification]
    target: [risk]
    inverse: mitigated_by
  sourced_from:
    description: The external document provides an originating source or authority for the item; the link is not fetched or verified.
    source: [term, actor, goal, scenario, requirement, design, decision, risk, verification, evidence, artifact]
    target: []
    external: true
  reported_at:
    description: The external address locates the report supporting the evidence; the link is not fetched or verified.
    source: [evidence]
    target: []
    external: true
