[package]
name = "work"
version = "0.1.0-alpha.1"
edition = "2024"
publish = false
description = "Local, agent-first issue tracker"
license = "MIT OR Apache-2.0"

[dependencies]
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
rustix = { version = "1.1.5", features = ["fs"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde_json = "1.0.151"
yaml-rust2 = "0.10.4"

[lib]
name = "work"
path = "src/lib.rs"

[[bin]]
name = "work"
path = "src/main.rs"
