name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Validate Mara schema
        run: npx --yes @convesoft/mara@0.3.0 --project "$GITHUB_WORKSPACE" --format json schema validate > schema-validation.json
      - name: Validate Mara corpus
        run: npx --yes @convesoft/mara@0.3.0 --project "$GITHUB_WORKSPACE" --format json project validate > project-validation.json
      - name: Require complete, valid Mara results
        run: |
          node -e '
            for (const file of ["schema-validation.json", "project-validation.json"]) {
              const result = require(`./${file}`);
              if (result.valid !== true || result.evaluation_complete !== true || result.has_more !== false) {
                console.error(file, JSON.stringify(result));
                process.exitCode = 1;
              }
            }
          '
